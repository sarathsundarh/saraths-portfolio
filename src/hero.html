<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero scenes · Sarath</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
:root{--paper:#F4F0E8;--ink:#16130F;--muted:#6F6A60;--rule:#D9D2C4;--accent:#9D2235;--gold:#E0A800;--ok:#2F7D4F;--lid:#E7E1D5;--panel:#FBF8F2;--figure:#F4F0E8;--skin:#F4F0E8;--hair:#16130F;--night:#1B2247;--night-a:.13}
:root[data-theme=dark]{--paper:#121010;--ink:#EFE9DE;--muted:#9C958A;--rule:#2E2A26;--accent:#E0566B;--gold:#FFCC00;--ok:#6FCF97;--lid:#24201D;--panel:#1A1715;--night:#000;--night-a:.35}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#121010;--ink:#EFE9DE;--muted:#9C958A;--rule:#2E2A26;--accent:#E0566B;--gold:#FFCC00;--ok:#6FCF97;--lid:#24201D;--panel:#1A1715;--night:#000;--night-a:.35}}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Geist Mono',ui-monospace,monospace}
.wrap{max-width:800px;margin:0 auto;border-left:1px dashed var(--rule);border-right:1px dashed var(--rule);min-height:100vh}
.banner{border-bottom:1px dashed var(--rule);padding:18px 16px 0;overflow:hidden;position:relative}
.scene{display:block;width:100%;height:auto;color:var(--ink);overflow:visible}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.now b{color:var(--ink);font-weight:500}
.dots{display:flex;gap:8px;align-items:center}
.dots button{width:28px;height:8px;padding:0;border-radius:999px;border:1px solid var(--rule);background:transparent;cursor:pointer;position:relative;overflow:hidden}
.dots button i{position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left}
.dots button.on{border-color:var(--accent)}
.dots button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbtn{font:inherit;font-size:12px;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:5px 11px;cursor:pointer}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:40px;margin:0;padding:8px 16px 0}
/* figure: always ink-on-paper */
.me{color:#16130F} .rays{color:var(--muted)} .hood-in{fill:#16130F}
.sil{fill:var(--figure)} .ink{fill:currentColor} .skin{fill:var(--skin)} .line{stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.hair{fill:var(--hair)} .curls{stroke:var(--skin);opacity:.55} .blush{fill:#9D2235;opacity:.16}
:root[data-theme=dark] .me{--figure:#EFE9DE;--skin:#EFE9DE}
:root[data-theme=dark] .hair{stroke:#EFE9DE;stroke-width:7;stroke-linejoin:round}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .me{--figure:#EFE9DE;--skin:#EFE9DE}:root:not([data-theme=light]) .hair{stroke:#EFE9DE;stroke-width:7;stroke-linejoin:round}}
.yawn{fill:#16130F;opacity:0;transition:opacity .2s}
.bubble{font-family:'Instrument Serif',serif;font-size:170px;fill:var(--accent);opacity:0}
.bg{color:var(--muted);opacity:.55}
.panel{fill:var(--panel);stroke:currentColor;stroke-width:6}
.tl{stroke:currentColor;stroke-width:3}.tl.r{fill:var(--accent)}.tl.y{fill:var(--gold)}.tl.g{fill:var(--paper)}
.fname{font-family:'Geist Mono',monospace;font-size:36px;fill:var(--muted)}
.code{font-family:'Geist Mono',monospace;font-size:54px;fill:currentColor}
.code .k{fill:var(--accent)} .code .s{fill:#8a6a00} :root[data-theme=dark] .code .s{fill:var(--gold)} .code .c{fill:var(--muted)} .code .ok{fill:var(--ok)} .code .err{fill:var(--accent)}
.lid-face,.base{fill:var(--lid);stroke:currentColor;stroke-width:8;stroke-linejoin:round}
.sticker{color:var(--accent)} .glint{fill:#fff;opacity:0}
/* props */
.bubble-box{fill:var(--panel);stroke:currentColor;stroke-width:6;stroke-linejoin:round}
.say{font-family:'Geist Mono',monospace;font-size:56px;fill:currentColor}
.bot-body{fill:var(--panel);stroke:currentColor;stroke-width:8}
.bot-eyes circle{fill:currentColor} .bot-mouth,.bot-ant,.bot-arm{fill:none;stroke:currentColor;stroke-width:8;stroke-linecap:round}
.bot-spark{fill:var(--accent)}
.chip-dot{fill:var(--accent)}
.cloud{fill:var(--panel);stroke:currentColor;stroke-width:6} .tdot{fill:var(--panel);stroke:currentColor;stroke-width:6}
.edge{stroke:var(--muted);stroke-width:3} .node{fill:var(--panel);stroke:currentColor;stroke-width:6}
.pulse{fill:var(--accent)}
.bulb-glass{fill:var(--panel);stroke:currentColor;stroke-width:7;transition:fill .3s} .bulb-base{fill:var(--muted)} .bulb-fil{fill:none;stroke:currentColor;stroke-width:5}
.bulb-rays{stroke:var(--gold);stroke-width:8;opacity:0;transition:opacity .3s}
.doc-sheet{fill:var(--panel);stroke:currentColor;stroke-width:6;stroke-linejoin:round} .doc-lines{stroke:var(--muted);stroke-width:5}
.banner{transition:background-color 1.2s ease}.banner.night{background-color:color-mix(in srgb,var(--paper),var(--night) calc(var(--night-a)*100%))}
.moon{fill:var(--gold);opacity:.85} .star{fill:var(--gold)}
.mug-body{fill:var(--accent);stroke:currentColor;stroke-width:7} .mug-handle,.steam{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round}
.steam{stroke:var(--muted)}
.bug-body{fill:var(--accent);stroke:currentColor;stroke-width:6} .bug-head{fill:currentColor} .bug-legs,.bug-ant,.bug-line{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round}
.splat path{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round}
/* ---------- scene visibility (morph = cross-fade in place) ---------- */
.p-code,.p-agent,.p-brain,.p-night{opacity:0;transition:opacity .7s ease}
.s-code .p-code,.s-agent .p-code,.s-night .p-code{opacity:1}
.s-night .p-night{opacity:1}
.s-agent .bot-wrap{opacity:1}
.s-brain .p-brain{opacity:1}
.say-me-g,.say-bot-g{opacity:0!important;transition:opacity .35s}
.say-me .say-me-g,.say-bot .say-bot-g{opacity:1!important}
/* ---------- motion ---------- */
[data-pivot]{transform-box:fill-box}
.lid{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.035)}
.rays,.sticker{opacity:0}
.arm{transform:rotate(var(--rest,0deg));transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.arm-l{--rest:-2deg}.arm-r{--rest:2deg}
.opened .arm{--rest:0deg}
.go .lid{animation:lid .7s cubic-bezier(.2,.9,.25,1.15) .05s forwards}
.go .arm-l{animation:liftL .7s cubic-bezier(.2,.9,.25,1.15) .05s forwards}
.go .arm-r{animation:liftR .7s cubic-bezier(.2,.9,.25,1.15) .05s forwards}
.opened .lid{animation:none;transform:none}
.opened .arm-l,.opened .arm-r{animation:none}
.go .sticker,.opened .sticker{animation:fade .35s ease .5s forwards}
.go .rays,.opened .rays{animation:rays 2.6s ease-in-out .6s infinite}
.go .glint{animation:glint 5s ease-in-out 1s infinite}
.typing .arm-l{animation:tapL .16s ease-in-out infinite alternate!important}
.typing .arm-r{animation:tapR .16s ease-in-out .08s infinite alternate!important}
.typing .head{animation:nod 1.1s ease-in-out infinite alternate}
.typing .torso{animation:bob .32s ease-in-out infinite alternate}
.tired.typing .arm-l,.tired.typing .arm-r{animation-duration:.34s!important}
.head{transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.pupils,.brow,.smile{transition:transform .35s ease,opacity .2s}
.look-up .head{animation:none;transform:rotate(-5deg) translate(6px,-10px)}
.look-up .pupils{transform:translate(3px,-14px)}
.look-up .smile{transform:scale(1.12);transform-box:fill-box;transform-origin:50% 0}
.look-up .brow{transform:translateY(-8px)}
.look-right .head{animation:none;transform:rotate(4deg) translate(6px,-4px)}
.look-right .pupils{transform:translate(16px,-4px)}
.think .head{animation:none;transform:rotate(7deg) translate(0,-4px)}
.think .pupils{transform:translate(12px,-16px)}
.think .arm-l{animation:none!important;transform:rotate(-1.5deg)} .think .arm-r{animation:none!important;transform:rotate(1.5deg)}
.lean .head{animation:none;transform:translate(14px,16px) rotate(2deg)}
.lean .pupils{transform:translate(14px,6px)}
.tired .eyes{transform-box:fill-box;transform-origin:50% 30%;transform:scaleY(.5)}
.yawning .smile{opacity:0} .yawning .yawn{opacity:1} .yawning .eyes{transform:scaleY(.15)}
.yawning .head{animation:none;transform:rotate(-6deg) translateY(-8px)}
.stretch .arm-l{animation:none!important;transform:rotate(6deg)} .stretch .arm-r{animation:none!important;transform:rotate(-6deg)}
.slam .arm-l{animation:slamL .22s ease-in 2!important} .slam .arm-r{animation:slamR .22s ease-in 2!important}
.q-on .q{animation:pop-b 1.6s ease forwards}
.ex-on .ex{animation:pop-b 1.1s ease forwards}
.blink .eyes{transform-box:fill-box;transform-origin:50% 50%;transform:scaleY(.1)}
.eyes{transition:transform .08s}
/* bot */
.bot{transform:translateY(210px);transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.bot-up .bot{transform:translateY(0)} .bot-up .sticker{visibility:hidden}
.bot-hop .bot{animation:hop .45s ease 2}
.bot-think .bot-spark{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.bot-think .bot-eyes{transform:translateY(-8px);transition:transform .3s}
/* brain */
.tdot,.cloud,.node,.edge,.bulb,.doc{opacity:0}
.cloud{transform-box:fill-box;transform-origin:0% 50%;transform:scale(.3);transition:transform .7s cubic-bezier(.3,1.3,.5,1),opacity .4s}
.b-cloud .tdot{animation:fade .3s ease forwards;animation-delay:calc(var(--i)*.18s)}
.b-cloud .cloud{opacity:1;transform:none;transition-delay:.45s}
.b-net .node{animation:pop-n .45s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(var(--i)*.06s);transform-box:fill-box;transform-origin:50% 50%}
.b-net .edge{opacity:1;transition:opacity .8s .3s}
.b-net .bulb{opacity:1;transition:opacity .4s .7s}
.b-lit .bulb-glass{fill:var(--gold)} .b-lit .bulb-rays{opacity:1}
.b-drop .doc{animation:drop 1.1s cubic-bezier(.5,0,.8,.4) forwards}
.b-fade .cloud,.b-fade .tdot,.b-fade .net,.b-fade .bulb{opacity:0!important;transition:opacity .5s}
/* night */
.star{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.37s)}
.steam{stroke-dasharray:14 14;animation:steam 1.6s linear infinite} .steam.s2{animation-delay:-.8s}
.bug-wrap{transform:translate(2260px,368px)}
.bug-crawl .bug-wrap{animation:crawl 3s linear forwards}
.bug{transform-box:fill-box;transform-origin:50% 100%;opacity:0;transition:opacity .3s}.bug-crawl .bug{opacity:1}
.bug-crawl .bug-legs{animation:legs .16s steps(2) infinite}
.bug-squash .bug-wrap{animation:none;transform:translate(1700px,368px)}
.bug-squash .bug{transform:scaleY(.15) scaleX(1.25);opacity:0;transition:transform .12s, opacity .5s .5s}
.splat{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.bug-squash .splat{animation:splat .6s ease forwards}
.bird{transform-box:fill-box;transform-origin:50% 50%;animation:flap .5s ease-in-out infinite alternate, fly 22s linear infinite}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease forwards}
.draw-g path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s ease .1s forwards}
.hangers{opacity:0;animation:fade .6s ease .9s forwards}
.paused *{animation-play-state:paused!important}
@keyframes lid{to{transform:scaleY(1)}}
@keyframes liftL{0%{transform:rotate(-2deg)}55%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
@keyframes liftR{0%{transform:rotate(2deg)}55%{transform:rotate(4deg)}100%{transform:rotate(0)}}
@keyframes tapL{from{transform:rotate(.3deg)}to{transform:rotate(-1.3deg)}}
@keyframes tapR{from{transform:rotate(-.3deg)}to{transform:rotate(1.3deg)}}
@keyframes slamL{50%{transform:rotate(-3.5deg)}} @keyframes slamR{50%{transform:rotate(3.5deg)}}
@keyframes nod{from{transform:rotate(-1.5deg) translateY(0)}to{transform:rotate(1.8deg) translateY(5px)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(3px)}}
@keyframes pop-b{0%{opacity:0;transform:translateY(30px) scale(.6)}25%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@keyframes pop-n{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
@keyframes hop{50%{transform:translateY(-40px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drop{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(-1580px,560px) scale(.3)}}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1);opacity:1}}
@keyframes steam{to{stroke-dashoffset:-56}}
@keyframes crawl{from{transform:translate(2260px,368px)}to{transform:translate(1700px,368px)}}
@keyframes legs{to{transform:scaleX(-1)}}
@keyframes splat{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.3)}}
@keyframes fade{to{opacity:1}}
@keyframes rays{0%,100%{opacity:.15}50%{opacity:.6}}
@keyframes glint{0%,70%{opacity:0;transform:translateX(-90px) skewX(-25deg)}75%{opacity:.9}90%{opacity:0;transform:translateX(250px) skewX(-25deg)}100%{opacity:0}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
@keyframes fly{0%{translate:0 0}50%{translate:-260px 40px}100%{translate:0 0}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.lid{transform:none}.arm{transform:none}.rays,.sticker,.hangers{opacity:1}.draw,.draw-g path{stroke-dashoffset:0}
  .s-brain .tdot,.s-brain .cloud,.s-brain .node,.s-brain .edge,.s-brain .bulb{opacity:1;transform:none}.s-brain .bulb-glass{fill:var(--gold)}.s-agent .bot{transform:none}.bug-wrap{display:none}}
</style>
</head>

  <h1>Sarath Sundar Harisaravanan</h1>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const banner=document.getElementById('banner');
banner.innerHTML=document.getElementById('scene-tpl').innerHTML;
const svg=banner.querySelector('svg');
svg.querySelectorAll('.draw, .draw-g path').forEach(p=>p.setAttribute('pathLength','1'));
svg.querySelectorAll('[data-pivot]').forEach(el=>{const [px,py]=el.dataset.pivot.split(' ').map(Number);const b=el.getBBox();el.style.transformOrigin=`${px-b.x}px ${py-b.y}px`});
const code=svg.querySelector('#code'), fname=svg.querySelector('#fname');
const cls=(...c)=>svg.classList.add(...c), uncls=(...c)=>svg.classList.remove(...c);

/* ---- pausable clock: every scene step is scheduled on it ---- */
let T=0, queue=[], paused=false, last=performance.now();
function at(t,fn){queue.push({t,fn});queue.sort((a,b)=>a.t-b.t)}
function tick(now){const dt=now-last;last=now;if(!paused){T+=dt;while(queue.length&&queue[0].t<=T)queue.shift().fn()}requestAnimationFrame(tick)}
requestAnimationFrame(tick);

/* ---- code window helpers ---- */
const caret=document.createElementNS(NS,'tspan');caret.textContent='▍';caret.setAttribute('fill','var(--accent)');
let rows=[];
function clearCode(){code.textContent='';rows=[]}
function row(i){while(rows.length<=i){const t=document.createElementNS(NS,'tspan');t.setAttribute('x','1300');t.setAttribute('dy',rows.length?'84':'0');code.appendChild(t);rows.push(t)}return rows[i]}
function setRow(i,segs){const t=row(i);t.textContent='';segs.forEach(([c,s])=>{const sp=document.createElementNS(NS,'tspan');if(c)sp.setAttribute('class',c);sp.textContent=s;t.appendChild(sp)})}
/* schedule typing of rows starting at t0; returns end time */
function typeRows(t0,lines,startRow=0,speed=28){
  let t=t0;
  lines.forEach((segs,li)=>{
    const r=startRow+li; let built=[];
    segs.forEach(([c,s])=>{for(let k=1;k<=s.length;k++){const snap=[...built,[c,s.slice(0,k)]];at(t,()=>{setRow(r,snap);row(r).appendChild(caret)});t+=speed*(0.7+Math.random()*0.6)}built.push([c,s])});
    t+=220;
  });
  return t;
}

/* ---- scenes ---- */
const SCENES=[
 {id:'code',label:'coding',dur:9000,run(t0){
   at(t0,()=>{fname.textContent='sarath.ts';clearCode();cls('typing')});
   let t=typeRows(t0+300,[
     [['k','const '],['','sarath = '],['k','new '],['','Engineer({']],
     [['','  based: '],['s','"Los Angeles"'],['',',']],
     [['','  studying: '],['s','"MS CS @ USC"'],['',',']]]);
   at(t,()=>{uncls('typing');cls('think','q-on')});
   at(t+1700,()=>{uncls('think','q-on');cls('typing')});
   t=typeRows(t+1800,[
     [['','  builds: ['],['s','"agents"'],['',', '],['s','"APIs"'],['',']']],
     [['','})']],
     [['k','await '],['','sarath.ship(idea) '],['c','// ✓']]],3);
   at(t,()=>{uncls('typing');cls('look-up','ex-on')});
   at(t+2000,()=>uncls('look-up','ex-on'));
 }},
 {id:'agent',label:'pairing with an AI agent',dur:12500,run(t0){
   at(t0,()=>{fname.textContent='agent.log';clearCode();cls('bot-up','look-right')});
   at(t0+900,()=>cls('say-me'));
   at(t0+2700,()=>{uncls('say-me');cls('say-bot','bot-think');svg.querySelector('.say-bot').textContent='on it ✦'});
   const calls=[[['c','▸ '],['','search('],['s','"flaky test"'],['',')']],[['c','▸ '],['','read('],['s','"auth.test.ts"'],['',')']],[['c','▸ '],['','run_tests()']]];
   let t=t0+3300;
   calls.forEach((segs,i)=>{at(t,()=>chip(i));t=typeRows(t+450,[segs],i*2,30);at(t+200,()=>setRow(i*2+1,[['ok','  ✓ '],['c',i<2?'done':'42 passing']]));t+=500});
   at(t,()=>{uncls('bot-think');svg.querySelector('.say-bot').textContent='fixed ✓';cls('bot-hop','look-up','ex-on')});
   at(t+1600,()=>uncls('say-bot','bot-hop','look-up','ex-on'));
   at(t+1900,()=>{uncls('bot-up','look-right');cls('typing')});
 }},
 {id:'brain',label:'brainstorming',dur:12000,run(t0){
   at(t0,()=>{uncls('typing');cls('think','q-on')});
   at(t0+500,()=>cls('b-cloud'));
   at(t0+1500,()=>cls('b-net'));
   for(let w=0;w<5;w++) at(t0+2600+w*900,()=>pulseWave());
   at(t0+7400,()=>{cls('b-lit');uncls('think','q-on');cls('look-up','ex-on')});
   at(t0+8700,()=>{cls('b-drop','b-fade')});
   at(t0+9800,()=>{uncls('look-up','ex-on');cls('typing')});
 }},
 {id:'night',label:'2 AM debugging',dur:13000,run(t0){
   at(t0,()=>{fname.textContent='auth.test.ts · 2:14 AM';clearCode();cls('tired','typing')});
   let t=typeRows(t0+400,[[['c','$ '],['','npm test']]],0,70);
   at(t+300,()=>{setRow(1,[['err','✗ login › refreshes token']]);setRow(2,[['c','  expected 200, got 401']])});
   at(t+900,()=>{uncls('typing');cls('yawning','stretch')});
   at(t+2300,()=>{uncls('yawning','stretch');cls('typing')});
   at(t+3000,()=>cls('bug-crawl'));
   at(t+3600,()=>{uncls('typing');cls('lean')});
   at(t+6100,()=>{cls('slam')});
   at(t+6300,()=>{cls('bug-squash');setRow(1,[['ok','✓ 42 passing']]);setRow(2,[['c','  0 failing · go to sleep']])});
   at(t+7000,()=>{uncls('lean','slam','tired');cls('look-up','ex-on')});
   at(t+8800,()=>uncls('look-up','ex-on'));
 }},
];
const STATE=['typing','think','q-on','look-up','ex-on','look-right','lean','tired','yawning','stretch','slam','bot-up','bot-think','bot-hop','say-me','say-bot','b-cloud','b-net','b-lit','b-drop','b-fade','bug-crawl','bug-squash'];
function chip(i){
  const g=svg.querySelector('.chips'); const c=document.createElementNS(NS,'circle');
  c.setAttribute('r','16');c.setAttribute('class','chip-dot');c.style.transform='translate(960px,690px)';g.appendChild(c);
  c.animate([{transform:'translate(960px,690px)',opacity:1},{transform:`translate(1290px,${282+i*168}px)`,opacity:1},{transform:`translate(1290px,${282+i*168}px)`,opacity:0}],{duration:700,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).onfinish=()=>c.remove();
}
const L1=[[1480,290],[1480,420],[1480,550]],L2=[[1720,230],[1720,350],[1720,490],[1720,610]],L3=[[1960,330],[1960,510]],BULB=[2180,410];
const pick=a=>a[Math.random()*a.length|0];
function pulseWave(){
  const g=svg.querySelector('.pulses');
  for(let k=0;k<4;k++){const p=[pick(L1),pick(L2),pick(L3),BULB];const c=document.createElementNS(NS,'circle');c.setAttribute('r','13');c.setAttribute('class','pulse');g.appendChild(c);
    c.animate(p.map(([x,y])=>({transform:`translate(${x}px,${y}px)`})),{duration:900,delay:k*120,easing:'linear',fill:'both'}).onfinish=()=>c.remove();
  }
}

/* ---- controller ---- */
let idx=0, sceneStart=0, sceneStarted=false;
const dots=document.getElementById('dots'), now=document.getElementById('now');
SCENES.forEach((s,i)=>{const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-label',s.label);b.title=s.label;b.innerHTML='<i></i>';b.onclick=()=>play(i);dots.appendChild(b)});
function play(i){
  queue=[]; idx=i; sceneStart=T;
  uncls(...STATE,...SCENES.map(s=>'s-'+s.id));
  cls('s-'+SCENES[i].id);
  banner.classList.toggle('night',SCENES[i].id==='night');
  now.textContent=SCENES[i].label;
  [...dots.children].forEach((b,k)=>{b.classList.toggle('on',k===i);b.setAttribute('aria-selected',k===i)});
  if(reduce){staticScene(i);return}
  SCENES[i].run(T+(i===0&&!sceneStarted?100:450));sceneStarted=true;
  at(T+SCENES[i].dur,()=>play((i+1)%SCENES.length));
}
function staticScene(i){
  clearCode();
  if(i===0){fname.textContent='sarath.ts';[[['k','const '],['','sarath = '],['k','new '],['','Engineer({']],[['','  based: '],['s','"Los Angeles"'],['',',']],[['','  builds: ['],['s','"agents"'],['',', '],['s','"APIs"'],['',']']],[['','})']]].forEach((r,k)=>setRow(k,r))}
  if(i===1){fname.textContent='agent.log';cls('bot-up');[[['c','▸ '],['','search('],['s','"flaky test"'],['',')']],[['ok','  ✓ '],['c','done']],[['c','▸ '],['','run_tests()']],[['ok','  ✓ '],['c','42 passing']]].forEach((r,k)=>setRow(k,r))}
  if(i===2){cls('b-cloud','b-net','b-lit')}
  if(i===3){fname.textContent='auth.test.ts · 2:14 AM';[[['c','$ '],['','npm test']],[['ok','✓ 42 passing']],[['c','  0 failing · go to sleep']]].forEach((r,k)=>setRow(k,r))}
}
// progress bar on the active dot
(function prog(){const s=SCENES[idx];const b=dots.children[idx];if(b&&!reduce){const p=Math.min(1,(T-sceneStart)/s.dur);b.firstChild.style.transform=`scaleX(${p})`;[...dots.children].forEach((d,k)=>{if(k!==idx)d.firstChild.style.transform='scaleX(0)'})}requestAnimationFrame(prog)})();
// pause while hovered
banner.addEventListener('mouseenter',()=>{paused=true;cls('paused')});
banner.addEventListener('mouseleave',()=>{paused=false;uncls('paused')});
// blink forever
(function blink(){setTimeout(()=>{if(!paused){cls('blink');setTimeout(()=>uncls('blink'),130)}blink()},2400+Math.random()*2600)})();
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const c=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=c==='dark'?'light':'dark'};
// intro: open the laptop once, then start cycling
if(reduce){cls('opened');play(0)}
else{requestAnimationFrame(()=>cls('go'));at(560,()=>{cls('opened');uncls('go');svg.querySelector('.glint').style.animation='glint 5s ease-in-out infinite';play(0)})}
</script>
